name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm build
      # The action runs the committed bundle, so it must match the source.
      - name: Check that dist is current
        run: git diff --exit-code -- dist

  e2e:
    name: Run the action on the fixture
    # The fixture rule reports a finding only on changed lines, and only a pull request has changed lines.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - id: alint
        uses: ./
        with:
          version: 0.7.3
          working-directory: test/fixture
          check-name: alint (fixture)
          # The fixture rule does not call this provider. The configuration proves that alint accepts the file.
          provider-config: |
            version = 1

            [[providers]]
            id = "fixture"
            type = "openai-compatible"
            endpoint = "https://provider.invalid/v1"

            [[providers.models]]
            id = "fixture-model"
            size = "small"
            aliases = [ "default" ]
            capabilities = [ "tool-call" ]

            [providers.models.default_params]
            thinking = { type = "disabled" }
      - name: Check that alint reads the provider configuration
        run: alint config models show fixture/fixture-model
      - name: Report the outputs
        run: echo "errors=${{ steps.alint.outputs.errors }} warnings=${{ steps.alint.outputs.warnings }}"
